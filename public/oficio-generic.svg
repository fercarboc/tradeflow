  <path d="M78 178 Q55 190 50 215" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M122 178 Q145 185 148 210" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
