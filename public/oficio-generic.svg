  <!-- Maletín principal -->
  <rect x="42" y="62" width="116" height="84" rx="10" fill="white" opacity="0.85"/>
  <rect x="42" y="94" width="116" height="8" rx="0" fill="#3b82f6" opacity="0.3"/>
