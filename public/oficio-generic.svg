  <line x1="132" y1="72" x2="132" y2="90" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <!-- Llave pequeña -->
  <path d="M118 108 Q128 108 128 118 Q128 128 118 128 L80 128 Q70 128 70 118 Q70 108 80 108 Z" fill="#bfdbfe" opacity="0.6"/>
  <!-- Figura humana -->
  <circle cx="100" cy="158" r="17" fill="white" opacity="0.85"/>
  <path d="M78 176 Q100 165 122 176 L126 240 Q100 248 74 240 Z" fill="white" opacity="0.85"/>
