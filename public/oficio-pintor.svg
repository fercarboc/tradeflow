<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Fondo transparente, figuras en blanco/azul claro para contrastar sobre card azul -->
  <!-- Rodillo de pintura -->
  <rect x="80" y="60" width="80" height="20" rx="5" fill="white" opacity="0.9"/>
  <rect x="85" y="65" width="70" height="10" rx="3" fill="#93c5fd" opacity="0.8"/>
  <rect x="118" y="80" width="6" height="30" rx="3" fill="white" opacity="0.9"/>
  <rect x="100" y="108" width="40" height="8" rx="4" fill="white" opacity="0.9"/>
  <!-- Mango del rodillo -->
  <line x1="121" y1="60" x2="121" y2="40" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="100" y1="40" x2="145" y2="40" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="145" y1="40" x2="145" y2="62" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <!-- Figura humana estilizada -->
  <!-- Cabeza -->
  <circle cx="100" cy="145" r="18" fill="white" opacity="0.85"/>
  <!-- Cuerpo con mono de trabajo -->
  <path d="M78 168 Q100 158 122 168 L128 240 Q100 248 72 240 Z" fill="white" opacity="0.85"/>
  <!-- Brazos -->
  <path d="M78 170 Q55 185 50 210" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M122 170 Q148 180 155 165 Q160 155 150 148" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Mano con rodillo -->
  <circle cx="150" cy="145" r="8" fill="white" opacity="0.85"/>
  <!-- Piernas -->
  <path d="M85 238 L80 285" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M115 238 L120 285" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <!-- Zapatos -->
  <ellipse cx="78" cy="286" rx="14" ry="6" fill="#bfdbfe" opacity="0.9"/>
  <ellipse cx="122" cy="286" rx="14" ry="6" fill="#bfdbfe" opacity="0.9"/>
  <!-- Detalles del mono (bolsillos) -->
  <rect x="88" y="190" width="12" height="10" rx="2" fill="#bfdbfe" opacity="0.6"/>
  <!-- Gota de pintura -->
  <ellipse cx="55" cy="215" rx="6" ry="8" fill="#bfdbfe" opacity="0.7"/>
  <path d="M55 206 Q58 200 55 196" stroke="#bfdbfe" stroke-width="3" fill="none" opacity="0.7"/>
</svg>
